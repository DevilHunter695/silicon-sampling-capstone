.cta{display:flex;gap:12px;flex-wrap:wrap}.btn{border:1px solid transparent;padding:11px 20px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;display:inline-flex;align-items:center;gap:8px}.btn:hover{transform:translateY(-1px)}.btn:active{transform:none}

.bar{display:grid;grid-template-columns:minmax(120px,210px) 1fr 52px;gap:10px;align-items:center;margin:4px 0;font-size:13.5px}.bar .lab{color:var(--ink2);text-align:right;line-height:1.2}.bar .tr{background:var(--bg2);border-radius:99px;height:14px;overflow:hidden}

function vGame(){const sc=S.sc;if(!S.g)S.g=D.rows[Math.floor(Math.random()*D.rows.length)];const r=S.g,q=D.Q[r[1]],done=r.done;
 return `<div class="card"><h2>You vs the model</h2><p class="sub">Guess this respondent's real answer. Then see what the model, a classifier and the majority guess said. Press <kbd class="k">1</kbd>&ndash;<kbd class="k">${NOPT(r[1])}</kbd> to answer.</p><div class="grid4"><div class="tile"><b>${sc.n?pc(sc.y/sc.n,0):"-"}</b><span>You (${sc.y} of ${sc.n}) &middot; streak ${sc.streak}</span></div><div class="tile hl"><b>${sc.n?pc(sc.ft/sc.n,0):"-"}</b><span>Fine-tuned model</span></div><div class="tile gold"><b>${sc.n?pc(sc.gb/sc.n,0):"-"}</b><span>Gradient boosting</span></div><div class="tile mj"><b>${sc.n?pc(sc.mj/sc.n,0):"-"}</b><span>Majority class</span></div></div></div>
 <div class="card"><div class="grid2"><div>${persona(r)}</div><div><p class="q">${q.text}</p>${q.opts.map((o,i)=>`<button class="opt ${done?(i==r[2]?"t":(i==done.pick?"w":"")):""}" ${done?"disabled":""} onclick="guess(${i})"><kbd>${i+1}</kbd>${o}</button>`).join("")}${done?`<div class="verdict ${done.pick==r[2]?"yes":"no"}">${done.pick==r[2]?ICON.check:ICON.cross}<div>${done.pick==r[2]?"You got it.":"Not this time."}<small>Model said: ${q.opts[ARG(r,3)]} (${pc(r[3+ARG(r,3)]/1000,0)}) &middot; ${ARG(r,3)==r[2]?"correct":"wrong"}</small></div></div><div class="row" style="margin-top:12px"><button class="btn navy" onclick="S.g=null;go()">Next respondent &rarr;</button></div>`:""}</div></div>${done?`<div style="margin-top:8px">${bars(LAB.ft,r,"ft")}</div>`:""}</div>`}
function guess(i){const r=S.g;if(!r||r.done)return;const sc=S.sc;r.done={pick:i};sc.n++;const w=i==r[2];sc.y+=w;sc.streak=w?sc.streak+1:0;sc.ft+=ok(r,"ft");sc.gb+=ok(r,"gb");sc.mj+=ok(r,"mj");go(null,3)}
function vFind(){const rs=D.Q.map((q,i)=>{const r=rowsQ(i),f=k=>r.filter(x=>ok(x,k)).length/r.length;return{n:q.name,ft:f("ft"),gb:f("gb"),mj:f("mj"),zs:f("zs")}}).sort((a,b)=>(b.ft-b.mj)-(a.ft-a.mj));
 const c=rowsQ(0),keys=[["Unmarried",2,"Unmarried"],["Married / partner",2,"Married or living with a partner"],["Divorced / widowed",2,"Divorced, separated, partner is no longer alive"]],dr=keys.map(([l,i,v])=>{const j=D.cats.marital_status.indexOf(v),s=c.filter(r=>D.R[r[0]][3]==j);return{l,n:s.length,a:s.filter(r=>ok(r,"ft")).length/s.length,h:s.filter(r=>CONF(r)>=.7).length/s.length}});
 return `<div class="card"><h2>Where it works, and where it does not</h2><p class="sub">Accuracy for every question on the full test fold. The lift over the majority guess is what matters.</p><div class="legend">`+["ft","gb","mj","zs"].map(k=>`<span style="--cc:${CV[k]}">${LAB[k]}</span>`).join("")+`</div>`+rs.map(x=>`<div class="grp"><div class="nm">${x.n} <small>fine-tuned ${x.ft>x.mj?"+":""}${((x.ft-x.mj)*100).toFixed(1)} points over majority</small></div>`+["ft","gb","mj","zs"].map(k=>`<div class="gr" style="--cc:${CV[k]};grid-template-columns:130px 1fr 54px"><span>${SHORT[k]}</span><div class="t"><i data-w="${x[k]*100/.65*100/100}%"></i></div><b style="font-weight:600">${pc(x[k])}</b></div>`).join("")+`</div>`).join("")+`</div>
 <div class="grid2"><div class="card"><h2 style="font-size:20px">What drives the confident predictions</h2><p class="sub">Number-of-children question, by marital status.</p><table class="ct"><tr><th>Marital status</th><th>Respondents</th><th>Accuracy</th><th>&gt;70% confident</th></tr>${dr.map(x=>`<tr><td>${x.l}</td><td>${x.n.toLocaleString()}</td><td>${pc(x.a)}</td><td>${pc(x.h)}</td></tr>`).join("")}</table><p class="sub" style="margin-top:10px">The model learned that unmarried respondents have no children. A classifier finds the same rule, so this shows it learned a real pattern, not that it beats classifiers.</p></div>
 <div class="card"><h2 style="font-size:20px">Honest limitations</h2><div style="display:grid;gap:10px"><div class="fnd bad"><b>One fold, one seed, one epoch</b><p>Results are from a single training run and one test fold.</p></div><div class="fnd bad"><b>No detectable gain on unseen questions</b><p>28.9% vs 28.5% on 8 held-out items with an approximate port. Inconclusive, not proof it cannot transfer.</p></div><div class="fnd bad"><b>Classifiers still win on accuracy</b><p>Gradient boosting reaches 40.0% against our 38.0%, at a tiny fraction of the compute.</p></div></div></div></div>`}
const VIEWS=[vOverview,vShow,vBuild,vGroup,vConf,vRace,vGame,vFind];
/* ---------- engine ---------- */
function afterRender(){requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll("[data-w]").forEach(e=>{const t=e.dataset.w;if(e.tagName=="I"||e.classList.contains("f"))e.style.width=t});document.querySelectorAll("[data-n]").forEach(e=>{const to=+e.dataset.n,d=+(e.dataset.d||0),s=e.dataset.s||"",t0=performance.now();(function f(t){const k=Math.min((t-t0)/900,1),v=to*(1-Math.pow(1-k,3));e.textContent=(d?v.toFixed(d):Math.round(v).toLocaleString())+s;if(k<1)requestAnimationFrame(f)})(t0);setTimeout(()=>{e.textContent=(d?to.toFixed(d):Math.round(to).toLocaleString())+s},1000)})}))}
function go(tab,keep){if(tab!=null&&tab!==S.tab){stopRace();S.tab=tab;scrollTo(0,0)}const y=scrollY;$("seg").innerHTML=TABS.map((t,i)=>`<button class="${i==S.tab?"on":""}" onclick="go(${i})" role="tab">${t}</button>`).join("");$("m").innerHTML=`<div class="view">`+VIEWS[S.tab]()+`</div>`;if(keep!=null)scrollTo(0,y);afterRender()}
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme=="dark"?"light":"dark";try{localStorage.setItem("th",h.dataset.theme)}catch(e){}go(null,1)}
try{const t=location.search.includes("light")?"light":localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t;else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark"}catch(e){}
document.addEventListener("keydown",e=>{if(e.target.tagName=="SELECT"||e.metaKey||e.ctrlKey)return;const k=e.key;
 if(S.tab==6&&S.g&&!S.g.done&&/^[1-9]$/.test(k)&&+k<=NOPT(S.g[1])){guess(+k-1);return}
 if(/^[1-8]$/.test(k)&&!(S.tab==6&&S.g&&!S.g.done)){go(+k-1);return}
 if(k=="d"||k=="D")toggleTheme();
 else if(S.tab==1&&k=="ArrowRight"){S.show=(S.show+1)%D.curated.length;go()}else if(S.tab==1&&k=="ArrowLeft"){S.show=(S.show+D.curated.length-1)%D.curated.length;go()}});
S.tab=+(location.hash.slice(1)||0);go();
</script></body></html>
