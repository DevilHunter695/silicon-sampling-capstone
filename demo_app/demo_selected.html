.pchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.pc{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px}.pc i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}

.bar{display:grid;grid-template-columns:minmax(120px,210px) 1fr 52px;gap:10px;align-items:center;margin:4px 0;font-size:13.5px}.bar .lab{color:var(--ink2);text-align:right;line-height:1.2}.bar .tr{background:var(--bg2);border-radius:99px;height:14px;overflow:hidden}

.bar .ck{display:inline-block;width:14px;color:var(--ok);font-weight:900}

.top-in{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}

@media(min-width:600px) and (max-width:1200px){

function vConf(){const p=confParts(),th=S.th;return `<div class="card"><h2>Confidence: only trust the model when it is sure</h2><p class="sub">Drag the slider to set the minimum confidence. Only answers at or above it are kept. Accuracy rises as you get stricter, and coverage falls.</p>
 <input type="range" min="0" max="0.95" step="0.01" value="${th}" style="--p:${th/.95*100}%" oninput="confMove(this)"><div id="ct">${p.tiles}</div></div><div id="cc">${p.rest}</div>`}
function confMove(el){S.th=+el.value;el.style.setProperty("--p",S.th/.95*100+"%");const p=confParts();$("ct").innerHTML=p.tiles;$("cc").innerHTML=p.rest;afterRender()}
function stopRace(){if(S.race&&S.race.t){clearInterval(S.race.t);S.race.t=null}}
function vRace(){return `<div class="card"><h2>Accuracy race</h2><p class="sub">Random real test answers are scored one at a time. Early on the lines jump around, then they settle near each method's true accuracy. This sample is not selected.</p><div class="row"><div class="field"><select id="rq"><option value="-1">All questions</option>${QS.map(i=>`<option value="${i}">${D.Q[i].name}</option>`).join("")}</select></div><div class="field"><select id="rn"><option>100</option><option selected>300</option><option>1000</option><option>3000</option></select></div><button class="btn navy" onclick="startRace()">&#9654; Start the race</button></div>
 <div class="grid4" id="rt" style="margin:16px 0"></div><svg class="chart" id="rs" viewBox="0 0 800 320"></svg></div>`}
function startRace(){stopRace();const q=+$("rq").value,n=+$("rn").value;let pool=D.rows.filter(r=>q<0||r[1]==q);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}pool=pool.slice(0,n);
 const st={k:0,c:{ft:0,gb:0,zs:0,mj:0},h:{ft:[],gb:[],zs:[],mj:[]},n};S.race=st;st.t=setInterval(()=>{const step=Math.max(1,Math.round(n/160));for(let s=0;s<step&&st.k<n;s++){const r=pool[st.k++];for(const k in st.c){st.c[k]+=ok(r,k)?1:0;st.h[k].push(st.c[k]/st.k)}}drawRace(st);if(st.k>=n)stopRace()},35)}
function drawRace(st){const n=st.n;$("rt").innerHTML=["ft","gb","mj","zs"].map(k=>`<div class="tile ${k=="ft"?"hl":k}"><b>${pc(st.c[k]/st.k)}</b><span>${LAB[k]}</span></div>`).join("");
 const X=i=>50+i/Math.max(n-1,1)*690,Y=v=>270-Math.min(v,.7)/.7*250;let s=`<text x="50" y="12">answers scored: ${st.k} of ${n}</text>`;for(let y=0;y<=.7;y+=.1)s+=`<line class="gl" x1="50" x2="740" y1="${Y(y)}" y2="${Y(y)}"/><text x="42" y="${Y(y)+4}" text-anchor="end">${(y*100).toFixed(0)}%</text>`;
 for(const k of ["mj","zs","gb","ft"]){const h=st.h[k];if(!h.length)continue;s+=`<polyline fill="none" stroke="${CV[k]}" stroke-width="${k=="ft"?3.5:2.2}" stroke-linejoin="round" points="${h.map((v,i)=>`${X(i)},${Y(v)}`).join(" ")}"/><circle cx="${X(h.length-1)}" cy="${Y(h[h.length-1])}" r="4.5" fill="${CV[k]}"/><text x="${X(h.length-1)+8}" y="${Y(h[h.length-1])+4}" style="fill:${CV[k]};font-weight:700">${SHORT[k]}</text>`}$("rs").innerHTML=s}
function vGame(){const sc=S.sc;if(!S.g)S.g=D.rows[Math.floor(Math.random()*D.rows.length)];const r=S.g,q=D.Q[r[1]],done=r.done;
 return `<div class="card"><h2>You vs the model</h2><p class="sub">Guess this respondent's real answer. Then see what the model, a classifier and the majority guess said. Press <kbd class="k">1</kbd>&ndash;<kbd class="k">${NOPT(r[1])}</kbd> to answer.</p><div class="grid4"><div class="tile"><b>${sc.n?pc(sc.y/sc.n,0):"-"}</b><span>You (${sc.y} of ${sc.n}) &middot; streak ${sc.streak}</span></div><div class="tile hl"><b>${sc.n?pc(sc.ft/sc.n,0):"-"}</b><span>Fine-tuned model</span></div><div class="tile gold"><b>${sc.n?pc(sc.gb/sc.n,0):"-"}</b><span>Gradient boosting</span></div><div class="tile mj"><b>${sc.n?pc(sc.mj/sc.n,0):"-"}</b><span>Majority class</span></div></div></div>
 <div class="card"><div class="grid2"><div>${persona(r)}</div><div><p class="q">${qtxt(q)}</p>${qgloss(q)}${q.opts.map((o,i)=>`<button class="opt ${done?(i==r[2]?"t":(i==done.pick?"w":"")):""}" ${done?"disabled":""} onclick="guess(${i})"><kbd>${i+1}</kbd><span>${opt(o)}</span></button>`).join("")}${done?`<div class="verdict ${done.pick==r[2]?"yes":"no"}">${done.pick==r[2]?ICON.check:ICON.cross}<div>${done.pick==r[2]?"You got it.":"Not this time."}<small>Model said: ${opt(q.opts[ARG(r,3)])} (${pc(r[3+ARG(r,3)]/1000,0)}) &middot; ${ARG(r,3)==r[2]?"correct":"wrong"}</small></div></div><div class="row" style="margin-top:12px"><button class="btn navy" onclick="S.g=null;go()">Next respondent &rarr;</button></div>`:""}</div></div>${done?`<div style="margin-top:8px">${bars(LAB.ft,r,"ft")}</div>`:""}</div>`}
function guess(i){const r=S.g;if(!r||r.done)return;const sc=S.sc;r.done={pick:i};sc.n++;const w=i==r[2];sc.y+=w;sc.streak=w?sc.streak+1:0;sc.ft+=ok(r,"ft");sc.gb+=ok(r,"gb");sc.mj+=ok(r,"mj");go(null,3)}
function vFind(){const rs=D.sum.byq.map(x=>({n:x.name,ft:x.ft,gb:x.gb,mj:x.mj,zs:x.zs})).sort((a,b)=>(b.ft-b.mj)-(a.ft-a.mj));
 const dr=D.sum.marital;
 return `<div class="card"><h2>Where it works, and where it does not</h2><p class="sub">Accuracy for every question on the full test fold${SELM?", all 46,209 answers and not only the selected ones":""}. The lift over the majority guess is what matters.</p><div class="legend">`+["ft","gb","mj","zs"].map(k=>`<span style="--cc:${CV[k]}">${LAB[k]}</span>`).join("")+`</div>`+rs.map(x=>`<div class="grp"><div class="nm">${x.n} <small>fine-tuned ${x.ft>x.mj?"+":""}${((x.ft-x.mj)*100).toFixed(1)} points over majority</small></div>`+["ft","gb","mj","zs"].map(k=>`<div class="gr" style="--cc:${CV[k]};grid-template-columns:130px 1fr 54px"><span>${SHORT[k]}</span><div class="t"><i data-w="${x[k]*100/.65*100/100}%"></i></div><b style="font-weight:600">${pc(x[k])}</b></div>`).join("")+`</div>`).join("")+`</div>
 <div class="grid2"><div class="card"><h2 style="font-size:20px">What drives the confident predictions</h2><p class="sub">Number-of-children question, by marital status.</p><table class="ct"><tr><th>Marital status</th><th>Respondents</th><th>Accuracy</th><th>&gt;70% confident</th></tr>${dr.map(x=>`<tr><td>${x.l}</td><td>${x.n.toLocaleString()}</td><td>${pc(x.a)}</td><td>${pc(x.h)}</td></tr>`).join("")}</table><p class="sub" style="margin-top:10px">The model learned that unmarried respondents have no children. A classifier finds the same rule, so this shows it learned a real pattern, not that it beats classifiers.</p></div>
 <div class="card"><h2 style="font-size:20px">Honest limitations</h2><div style="display:grid;gap:10px"><div class="fnd bad"><b>One fold, one seed, one epoch</b><p>Results are from a single training run and one test fold.</p></div><div class="fnd bad"><b>No detectable gain on unseen questions</b><p>28.9% vs 28.5% on 8 held-out items with an approximate port. Inconclusive, not proof it cannot transfer.</p></div><div class="fnd bad"><b>Classifiers still win on accuracy</b><p>Gradient boosting reaches 40.0% against our 38.0%, at a tiny fraction of the compute.</p></div></div></div></div>`}
const VIEWS=[vOverview,SELM?vShow:vDraw,vBuild,vGroup,vConf,vRace,vGame,vFind];
/* ---------- engine ---------- */
function afterRender(){requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll("[data-w]").forEach(e=>{const t=e.dataset.w;if(e.tagName=="I"||e.classList.contains("f"))e.style.width=t});document.querySelectorAll("[data-n]").forEach(e=>{const to=+e.dataset.n,d=+(e.dataset.d||0),s=e.dataset.s||"",t0=performance.now();(function f(t){const k=Math.min((t-t0)/900,1),v=to*(1-Math.pow(1-k,3));e.textContent=(d?v.toFixed(d):Math.round(v).toLocaleString())+s;if(k<1)requestAnimationFrame(f)})(t0);setTimeout(()=>{e.textContent=(d?to.toFixed(d):Math.round(to).toLocaleString())+s},1000)})}))}
function go(tab,keep){if(tab!=null&&tab!==S.tab){stopRace();S.tab=tab;scrollTo(0,0)}const y=scrollY;$("seg").innerHTML=TABS.map((t,i)=>`<button class="${i==S.tab?"on":""}" onclick="go(${i})" role="tab">${t}</button>`).join("");$("m").innerHTML=`<div class="view">`+VIEWS[S.tab]()+`</div>`;if(keep!=null)scrollTo(0,y);afterRender()}
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme=="dark"?"light":"dark";try{localStorage.setItem("th",h.dataset.theme)}catch(e){}go(null,1)}
try{const t=location.search.includes("light")?"light":localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t;else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark"}catch(e){}
document.addEventListener("keydown",e=>{if(e.target.tagName=="SELECT"||e.metaKey||e.ctrlKey)return;const k=e.key;
 if(VIEWS[S.tab]==vGame&&S.g&&!S.g.done&&/^[1-9]$/.test(k)&&+k<=NOPT(S.g[1])){guess(+k-1);return}
 if(/^[1-9]$/.test(k)&&+k<=TABS.length&&!(VIEWS[S.tab]==vGame&&S.g&&!S.g.done)){go(+k-1);return}
 if(k=="d"||k=="D")toggleTheme();
 else if(SELM&&VIEWS[S.tab]==vShow&&k=="ArrowRight"){S.show=(S.show+1)%D.curated.length;go()}else if(SELM&&VIEWS[S.tab]==vShow&&k=="ArrowLeft"){S.show=(S.show+D.curated.length-1)%D.curated.length;go()}else if(!SELM&&VIEWS[S.tab]==vDraw&&k=="ArrowRight"){drawNew();go(null,1)}});
S.tab=Math.min(+(location.hash.slice(1)||0)||0,TABS.length-1);go();
</script></body></html>
